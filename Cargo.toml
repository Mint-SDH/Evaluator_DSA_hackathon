[package]
name = "c-autograder"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
zip = { version = "2.2", default-features = false, features = ["deflate", "time"] }
walkdir = "2.5"
tempfile = "3.17"
wait-timeout = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
indicatif = { version = "0.17", features = ["rayon"] }
regex = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

